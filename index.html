<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="bref">
<meta name="description" content="Searchable dictionary for bref, the alphabetic shorthand system by Donald M. Volk — 11,660 words, searchable in both directions, with an English-to-bref converter. Works offline.">
<title>bref Dictionary</title>
<style>
  :root {
    /* Light theme — warm paper with red ink. */
    --bg: #fbfbfa;
    --fg: #1c1c1a;
    --muted: #6d6d68;
    --card: #ffffff;
    --accent: #a83c38;
    --border: #e2e1dc;
    --mark: rgba(240, 176, 100, 0.45);
    --scrim: rgba(28, 28, 26, 0.42);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      /* Dark theme — ink with warm highlights. */
      --bg: #16161a;
      --fg: #e9e8e4;
      --muted: #93928c;
      --card: #1e1e23;
      --accent: #f0847f;
      --border: #2e2e34;
      --mark: rgba(240, 132, 127, 0.28);
      --scrim: rgba(0, 0, 0, 0.62);
    }
  }
  * { box-sizing: border-box; }
  html { scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { width: 0; height: 0; display: none; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--fg);
    line-height: 1.4;
    scrollbar-width: none; -ms-overflow-style: none;
    -webkit-text-size-adjust: 100%;
  }
  body.modal-open { overflow: hidden; }
  header {
    position: sticky; top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px 10px;
    z-index: 10;
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0 8px 0 0; font-weight: 600; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
  input[type=search] {
    flex: 1 1 240px;
    font-size: 18px; padding: 8px 12px;
    background: var(--card); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px;
    min-width: 0;
  }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
              font-size: 14px; color: var(--muted); margin-top: 8px; }
  #stats { color: var(--muted); font-size: 13px; margin-left: auto; }
  .btn {
    font: inherit; font-size: 13px;
    color: var(--accent); background: var(--card);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 12px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  main { padding: 12px 16px 60px; max-width: 880px; margin: 0 auto; }
  .entry {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .word { font-weight: 600; font-size: 17px; color: var(--accent); overflow-wrap: anywhere; }
  .brf { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
         letter-spacing: 0.03em; }
  .dir { font-size: 11px; color: var(--muted); text-transform: uppercase;
         letter-spacing: 0.04em; padding: 1px 5px; border: 1px solid var(--border);
         border-radius: 3px; white-space: nowrap; }
  .translations { margin-top: 4px; }
  .trans { display: inline-block; margin-right: 10px; overflow-wrap: anywhere; }
  .len { font-size: 11px; color: var(--muted); vertical-align: super; margin-left: 3px; }
  .loading, .empty { padding: 30px 16px; text-align: center; color: var(--muted); }
  .source { font-size: 12px; color: var(--muted); margin-top: 20px; text-align: center;
            line-height: 1.7; }
  .source a { color: var(--muted); }
  mark { background: var(--mark); color: inherit; padding: 0 1px; border-radius: 2px; }

  /* Converter — a modal view, deliberately separate from the dictionary. */
  .modal {
    position: fixed; inset: 0; z-index: 50;
    background: var(--scrim);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .modal[hidden] { display: none; }
  .sheet {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: min(720px, 100%);
    max-height: 100%;
    display: flex; flex-direction: column;
    padding: 14px 16px 16px;
    overflow-y: auto;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
  }
  .sheet-head { display: flex; align-items: baseline; gap: 10px; }
  .sheet-head h2 { font-size: 16px; margin: 0; font-weight: 600; }
  .sheet-head p { margin: 0; font-size: 12px; color: var(--muted); }
  .icon {
    margin-left: auto; font: inherit; font-size: 22px; line-height: 1;
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 0 4px;
  }
  .icon:hover { color: var(--accent); }
  .lblrow { display: flex; align-items: center; gap: 8px; margin: 14px 0 4px; }
  .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase;
         letter-spacing: 0.05em; }
  .lblrow .btn { margin-left: auto; }
  #conv-in, .out {
    width: 100%;
    font-size: 15px; line-height: 1.55;
    background: var(--card); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px;
  }
  #conv-in { font-family: inherit; min-height: 7.5em; resize: vertical; }
  #conv-in:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .out {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    white-space: pre-wrap; overflow-wrap: anywhere;
    min-height: 7.5em; color: var(--accent);
  }
  .out .unk {
    color: var(--muted);
    text-decoration: underline dotted currentColor;
    text-underline-offset: 3px;
  }
  .out .ph { color: var(--muted); font-family: inherit; font-style: italic; }
  .convstats { margin-top: 8px; font-size: 12px; color: var(--muted); min-height: 1.5em; }
  .convnote { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>bref <small>dictionary</small></h1>
    <input id="q" type="search" placeholder="Search either direction (e.g. because, bcs, tt)…"
           autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
  </div>
  <div class="controls">
    <button type="button" id="conv-open" class="btn">converter</button>
    <span id="stats">loading…</span>
  </div>
</header>
<main>
  <div id="results" class="loading">Loading dictionary…</div>
  <div class="source" id="source"></div>
</main>

<div id="conv" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="conv-title">
    <div class="sheet-head">
      <h2 id="conv-title">English → bref</h2>
      <button type="button" id="conv-close" class="icon" aria-label="Close converter">&times;</button>
    </div>
    <div class="lblrow"><span class="lbl">English</span></div>
    <textarea id="conv-in" spellcheck="false"
              placeholder="Type or paste English here…"></textarea>
    <div class="lblrow">
      <span class="lbl">bref</span>
      <button type="button" id="conv-copy" class="btn">copy</button>
    </div>
    <div id="conv-out" class="out" aria-live="polite"></div>
    <div id="conv-stats" class="convstats"></div>
    <p class="convnote">Words the dictionary doesn&rsquo;t carry are left as they are and
    <span class="unk" style="text-decoration:underline dotted;text-underline-offset:3px">underlined</span>.
    bref is written entirely in lower case, and apostrophes are dropped from
    contractions and possessives.</p>
  </div>
</div>

<script>
(async function() {
  const $ = (s) => document.querySelector(s);
  const resultsEl = $('#results');
  const stats = $('#stats');
  const qInput = $('#q');

  let DATA = null;
  try {
    const res = await fetch('dictionary.json');
    DATA = await res.json();
  } catch (e) {
    resultsEl.textContent = 'Failed to load dictionary.json: ' + e.message;
    return;
  }

  const escapeHTML = (s) => s.replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  $('#source').innerHTML =
    escapeHTML(DATA.source) +
    ' · <a href="' + escapeHTML(DATA.source_url) + '">announcement</a>' +
    ' · <a href="' + escapeHTML(DATA.materials_url) + '">manual &amp; word lists</a>' +
    ' · <a href="https://mtaran.github.io/bref-shorthand/">rules &amp; core vocabulary</a>' +
    '<br>' + escapeHTML(DATA.note) +
    '<br>Shared freely by the author: “This is not a commercial product. It is not ' +
    'for sale… It is completely free to explore and find what is useful.”';

  stats.textContent = DATA.counts.words.toLocaleString() + ' words';

  // bref is a bijection, so each stored pair yields one entry per direction.
  const entries = [];
  for (const [english, bref] of DATA.words) {
    const enLow = english.toLowerCase(), brefLow = bref.toLowerCase();
    entries.push({ dir: 'en', head: english, other: bref,
                   headLow: enLow, otherLow: brefLow });
    entries.push({ dir: 'bref', head: bref, other: english,
                   headLow: brefLow, otherLow: enLow });
  }

  const highlight = (text, q) => {
    if (!q) return escapeHTML(text);
    const escaped = escapeHTML(text);
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    return escaped.replace(re, '<mark>$1</mark>');
  };

  // Head matches outrank matches on the far side of the entry.
  function score(e, q) {
    if (!q) return 1;
    const headLow = e.headLow;
    if (headLow === q) return 1000;
    if (headLow.startsWith(q + ' ')) return 700;
    if (headLow.startsWith(q)) return 500;
    const pos = headLow.indexOf(q);
    if (pos >= 0) return 250 - pos;
    const other = e.otherLow;
    if (other === q) return 120;
    if (other.startsWith(q)) return 60;
    if (other.includes(q)) return 20;
    return 0;
  }

  function renderEntry(e, q) {
    const headCls = e.dir === 'bref' ? 'word brf' : 'word';
    const otherCls = e.dir === 'bref' ? 'trans' : 'trans brf';
    const label = e.dir === 'bref' ? 'bref → en' : 'en → bref';
    const len = e.dir === 'bref' ? e.head.length : e.other.length;
    return '<div class="entry">' +
      '<div class="head">' +
        '<span class="' + headCls + '">' + highlight(e.head, q) + '</span>' +
        '<span class="dir">' + label + '</span>' +
      '</div>' +
      '<div class="translations">' +
        '<span class="' + otherCls + '">' + highlight(e.other, q) +
        '<span class="len">' + len + '</span></span>' +
      '</div>' +
    '</div>';
  }

  const LIMIT = 200;
  function render() {
    const q = qInput.value.trim().toLowerCase();

    const matches = [];
    for (const e of entries) {
      const s = score(e, q);
      if (s > 0) matches.push([s, e]);
    }
    matches.sort((a, b) => b[0] - a[0] || (a[1].head < b[1].head ? -1 : 1));

    const total = matches.length;
    const shown = matches.slice(0, LIMIT);
    if (total === 0) {
      resultsEl.className = 'empty';
      resultsEl.textContent = q ? 'No matches for "' + q + '".' : 'Nothing to show.';
      return;
    }
    resultsEl.className = '';
    const footer = total > shown.length
      ? '<div class="loading">Showing first ' + shown.length + ' of '
        + total.toLocaleString() + ' matches.</div>'
      : '';
    resultsEl.innerHTML = shown.map(([_, e]) => renderEntry(e, q)).join('') + footer;
  }

  qInput.addEventListener('input', render);
  render();

  // ---------------------------------------------------------------------- //
  // Converter: English in, bref out.
  // ---------------------------------------------------------------------- //

  // Case-sensitive first, so "March" (mar) stays distinct from "march" (mrc);
  // the lowercase map prefers the entry that is already written lower case, so
  // a sentence-initial "The" still resolves to the everyday word.
  const EXACT = new Map(), LOWER = new Map();
  for (const [english, bref] of DATA.words) {
    EXACT.set(english, bref);
    const low = english.toLowerCase();
    if (!LOWER.has(low) || english === low) LOWER.set(low, bref);
  }

  // Lower-case stand-ins for the characters that would need a shift key.
  const PUNCT = { '?': '/', '!': '//', '%': ',,', ':': ';;',
                  '(': '[[', ')': ']]', '$': '==' };
  const punct = (s) => s.replace(/[?!%:()$]/g, (c) => PUNCT[c]);

  const WORD_RE = /[A-Za-z]+(?:'[A-Za-z]+)*/g;

  function compressWord(w) {
    let b = EXACT.get(w);
    if (b !== undefined) return { text: b, known: true };
    b = LOWER.get(w.toLowerCase());
    if (b !== undefined) return { text: b, known: true };
    if (w.indexOf("'") >= 0) {
      const bare = w.replace(/'/g, '');
      b = EXACT.get(bare);
      if (b === undefined) b = LOWER.get(bare.toLowerCase());
      if (b !== undefined) return { text: b, known: true };
      // Apostrophes are dropped even when the word isn't in the dictionary.
      return { text: bare.toLowerCase(), known: false };
    }
    return { text: w.toLowerCase(), known: false };
  }

  function compress(text) {
    const tokens = [];
    let i = 0, m;
    WORD_RE.lastIndex = 0;
    while ((m = WORD_RE.exec(text)) !== null) {
      if (m.index > i) {
        tokens.push({ text: punct(text.slice(i, m.index)), sep: true });
      }
      const r = compressWord(m[0]);
      tokens.push({ text: r.text, sep: false, known: r.known });
      i = m.index + m[0].length;
    }
    if (i < text.length) tokens.push({ text: punct(text.slice(i)), sep: true });
    return tokens;
  }

  const conv = $('#conv');
  const convIn = $('#conv-in');
  const convOut = $('#conv-out');
  const convStats = $('#conv-stats');
  const convCopy = $('#conv-copy');
  const STORE_KEY = 'bref-converter-input';

  let plainOut = '';

  function runConverter() {
    const text = convIn.value;
    try { localStorage.setItem(STORE_KEY, text); } catch (e) {}

    if (!text.trim()) {
      plainOut = '';
      convOut.innerHTML = '<span class="ph">bref appears here as you type.</span>';
      convStats.textContent = '';
      return;
    }

    const tokens = compress(text);
    plainOut = tokens.map((t) => t.text).join('');
    convOut.innerHTML = tokens.map((t) =>
      t.sep || t.known ? escapeHTML(t.text)
                       : '<span class="unk">' + escapeHTML(t.text) + '</span>'
    ).join('');

    const wordTokens = tokens.filter((t) => !t.sep);
    const unknown = wordTokens.filter((t) => !t.known).length;
    const before = text.length, after = plainOut.length;
    const saved = before > 0 ? Math.round((1 - after / before) * 100) : 0;
    let line = before.toLocaleString() + ' → ' + after.toLocaleString()
             + ' characters · ' + saved + '% shorter';
    if (wordTokens.length) {
      line += ' · ' + (wordTokens.length - unknown).toLocaleString() + ' of '
            + wordTokens.length.toLocaleString() + ' words abbreviated';
    }
    convStats.textContent = line;
  }

  const isConvOpen = () => !conv.hidden;

  function openConv() {
    conv.hidden = false;
    document.body.classList.add('modal-open');
    runConverter();
    convIn.focus();
  }

  function closeConv() {
    conv.hidden = true;
    document.body.classList.remove('modal-open');
    qInput.focus();
  }

  try {
    const saved = localStorage.getItem(STORE_KEY);
    if (saved) convIn.value = saved;
  } catch (e) {}

  $('#conv-open').addEventListener('click', openConv);
  $('#conv-close').addEventListener('click', closeConv);
  conv.addEventListener('click', (e) => { if (e.target === conv) closeConv(); });
  convIn.addEventListener('input', runConverter);

  convCopy.addEventListener('click', async () => {
    if (!plainOut) return;
    try {
      await navigator.clipboard.writeText(plainOut);
    } catch (e) {
      // Clipboard API needs a secure context; fall back to a temporary field.
      const ta = document.createElement('textarea');
      ta.value = plainOut;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e2) {}
      document.body.removeChild(ta);
    }
    const was = convCopy.textContent;
    convCopy.textContent = 'copied';
    setTimeout(() => { convCopy.textContent = was; }, 1200);
  });

  // ---------------------------------------------------------------------- //

  const focusSearch = () => { qInput.focus(); qInput.select(); };

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isConvOpen()) {
      e.preventDefault();
      closeConv();
      return;
    }
    // "/" focuses the search box (unless the user's already typing in a field).
    if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (isConvOpen()) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    e.preventDefault();
    focusSearch();
  });

  // Re-grab focus whenever the page becomes visible/focused again. This is also
  // what raises the on-screen keyboard when the app is launched from a home
  // screen shortcut, which is the point: open it and start typing. While the
  // converter is up, its own field is the one that should get focus.
  const refocus = () => { if (isConvOpen()) convIn.focus(); else focusSearch(); };
  window.addEventListener('focus', refocus);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refocus();
  });
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
